spring.application.name=dreamjournal-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/dreamjournal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:bichonel08}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

openai.api.key=${OPENAI_API_KEY:}
openai.provider=${AI_PROVIDER:fallback}
openai.model=${OPENAI_MODEL:gpt-5.4-mini}
openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
openai.responses-url=https://api.openai.com/v1/responses
openai.embeddings-url=https://api.openai.com/v1/embeddings
